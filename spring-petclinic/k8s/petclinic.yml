---
apiVersion: v1
kind: Service
metadata:
  name: petclinic
  labels:
    app: petclinic
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      # nodePort removed - let Kubernetes assign automatically
      protocol: TCP
      name: http
  selector:
    app: petclinic
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  labels:
    app: petclinic
spec:
  replicas: 2  # Multi-node: spread across worker nodes
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
        # Datadog auto-discovery tags
        tags.datadoghq.com/env: "dev"
        tags.datadoghq.com/service: "petclinic"
        tags.datadoghq.com/version: "1.0.0"
    spec:
      containers:
        - name: petclinic
          # Docker Hub image - ArgoCD will pull from here
          # Update this image tag in Git to trigger new deployment
          image: pavandoc1990/spring-petclinic:latest
          imagePullPolicy: Always  # Always pull latest when using 'latest' tag
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: postgres
            - name: SERVICE_BINDING_ROOT
              value: /bindings
            - name: SPRING_APPLICATION_JSON
              value: |
                {
                  "management.endpoint.health.probes.add-additional-paths": true
                }
            # Datadog Java Agent configuration
            - name: DD_SERVICE
              value: "petclinic"
            - name: DD_ENV
              value: "dev"
            - name: DD_VERSION
              value: "1.0.0"
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: DD_TRACE_ENABLED
              value: "true"
            - name: DD_PROFILING_ENABLED
              value: "true"
            - name: DD_APM_ENABLED
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/datadog-lib/dd-java-agent.jar"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - mountPath: /bindings/secret
              name: binding
              readOnly: true
            - mountPath: /datadog-lib
              name: datadog-lib
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: binding
          projected:
            sources:
              - secret:
                  name: demo-db
        - name: datadog-lib
          emptyDir: {}  # Will be populated by Datadog init container
