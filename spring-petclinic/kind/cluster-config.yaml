# KIND Multi-Node Cluster Configuration
# This creates a cluster with 1 control plane and 2 worker nodes
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: petclinic-cluster
nodes:
  # Control plane node
  - role: control-plane
    image: kindest/node:v1.28.0
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "node-role=control-plane"
  # Worker nodes
  - role: worker
    image: kindest/node:v1.28.0
    extraPortMappings:
      - containerPort: 30652
        hostPort: 30652
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "node-role=worker,node-type=worker-1"
  - role: worker
    image: kindest/node:v1.28.0
    extraPortMappings:
      - containerPort: 30652
        hostPort: 30652
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "node-role=worker,node-type=worker-2"
networking:
  # Use default CNI (kindnet)
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"

